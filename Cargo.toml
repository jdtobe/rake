[package]
name = "quake-terminal"
version = "0.1.0"
edition = "2021"
description = "A Quake-style drop-down terminal (currently: a menubar icon with About and Quit)"
license = "MIT"
repository = "https://github.com/jdtobe/rake"
publish = false

[dependencies]
global-hotkey = "0.9.0"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSScreen", "NSResponder"] }
serde = { version = "1.0.229", features = ["derive"] }
softbuffer = "0.4.8"
tao = "0.37.1"
toml = "1.1.8"
tray-icon = "0.26.1"
