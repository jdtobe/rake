[package]
name = "rake"
version = "0.1.0"
edition = "2021"
description = "A macOS-first Quake-style drop-down terminal"
license = "MIT"
repository = "https://github.com/jdtobe/rake"
publish = false

[dependencies]
base64 = "0.23"
global-hotkey = "0.9.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSColor", "NSColorSpace", "NSFont", "NSPasteboard", "NSWindow", "NSScreen", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSKeyedArchiver", "NSString", "NSUserDefaults"] }
portable-pty = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tao = "0.37.1"
toml = "1.1.8"
tray-icon = "0.26.1"
wry = { version = "0.57", default-features = false }
