[package]
name = "quake-terminal"
version = "0.1.0"
edition = "2021"
description = "A Quake-style drop-down terminal (currently: a menubar icon with About and Quit)"
publish = false

[dependencies]
global-hotkey = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
softbuffer = "0.4.8"
tao = "0.37.1"
toml = "1.1.8"
tray-icon = "0.26.1"
