name: Bug report
description: Something in Rake does not work as it should
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, please use the
        [security policy](../security/policy) instead of a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error text from the terminal you launched Rake from.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `cargo run`
        2. Press …
        3. …
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: For example macOS 26.1. Only macOS is tested.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rake version
      description: The release tag, or the commit you built from.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The contents of your config file under `~/.config/`, if you have one. Redact anything private.
      render: toml
