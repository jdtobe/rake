name: Release

# Manual only. Dry-run executes all checks/builds but cannot tag or publish.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify a release build without creating a tag or release
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Releases and dry-runs must be dispatched from main'
            exit 1
          fi

  checks:
    needs: guard
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Calculate and stamp version
        id: version
        run: |
          tag="$(.github/scripts/next-version.sh)"
          python3 .github/scripts/stamp-version.py "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build stamped arm64 binary
        run: |
          test "$(uname -m)" = arm64
          cargo build --release --locked
      - name: Package and inspect mounted DMG
        id: package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          dmg="$(scripts/package.sh "${TAG#v}")"
          checksum="$(scripts/verify-package.sh "$dmg" "${TAG#v}")"
          echo "sha256=${checksum%% *}" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
      - name: Keep verified build for dry-run or publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dmg
          path: ${{ steps.package.outputs.dmg }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No source checkout or execution of repository code in this write-token job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dmg
          path: release
      - name: Publish exactly the verified DMG at the checked commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          dmg="release/Rake-${TAG}-arm64.dmg"
          printf '%s  %s\n' "$SHA256" "$dmg" | sha256sum --check -
          # Fail on an existing ref rather than publishing against an unchecked tag.
          gh api "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}"
          gh release create "$TAG" "$dmg" --verify-tag --title "$TAG" --generate-notes \
            --notes "SHA-256 (Rake-${TAG}-arm64.dmg): ${SHA256}" --target "$GITHUB_SHA"
